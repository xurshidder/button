# pnpm blocks dependency build scripts unless they are listed here.
#
# Prisma MUST be allowed: its postinstall downloads the query engine, and
# without it `prisma generate` produces a client that cannot connect. That
# failure only shows up on a clean install — a local machine that already has
# the engines cached keeps working, which makes it a deploy-only break.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true
